version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "16:17"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    groups:
      npm-patch-minor:
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "16:29"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
